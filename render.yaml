databases:
  - name: warung-empuk-db
    plan: free
    databaseName: warung_empuk
    user: warung_empuk

services:
  - type: web
    name: warung-empuk
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: warung-empuk-db
          property: connectionString
      - key: NODE_VERSION
        value: 20.11.0
